# SpreadsheetBench eval -- reduced-scale variant of reasoning_bank_eval.yaml.
conditions:
  nobank:
    bank: null
  orig:
    bank: null
  ours:
    bank: null
env:
  import_path: envharness.bridges.spreadsheetbench.bridge:SpreadsheetBenchEnv
  reset_options:
    data_path: experiments/spreadsheetbench/data/_dl/all_data_912_v0.1
    multi_test_case: true
    obs_truncate: 6000
    preview_rows: 20
    step_timeout: 60
eval:
  concurrency: 8
  n: 300
  start_idx: 100
model:
  max_response_tokens: 65535
  name: openai/gpt-4.1-mini
  reasoning_effort: low
  temperature: 0.3
policy:
  max_steps: 24
retrieval:
  mmr_lambda: 0.5
  mode: mmr
  top_k: 5
