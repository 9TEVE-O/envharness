# OfficeQA eval -- reduced-scale variant of reasoning_bank_eval.yaml.

model:
  name: openai/gpt-4.1-mini
  temperature: 0.3
  reasoning_effort: low
  max_response_tokens: 65535    # 3.5-flash reasons verbosely; a low cap truncates turns
                                # mid-thought (no tool call -> answer never saved -> false fail)

policy:
  max_steps: 30                 # grep/read/glob/answer turns per task

retrieval:
  top_k: 3                      # skills injected into the system prompt

eval:
  start_idx: 0                  # test split is a separate file; index from 0
  n: 172                        # test split size
  concurrency: 8

env:
  import_path: envharness.bridges.officeqa.bridge:OfficeQAEnv
  reset_options:
    data_path: experiments/officeqa/data
    # docs_root: set here, or export OFFICEQA_DOCS_DIR (dir of parsed .txt docs)
    split: test

conditions:
  nobank:
    bank: null
  orig:
    bank: null                  # override: reasoning_bank_eval.py --bank-overrides orig=<path>
  ours:
    bank: null                  # override: reasoning_bank_eval.py --bank-overrides ours=<path>
