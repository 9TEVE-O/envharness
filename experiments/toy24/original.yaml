# toy24 ORIGINAL env (NoopMutator): measures the Policy's natural success rate
# WITHOUT any mutation. Mutator always proposes an empty pass-through
# MutationLayer and ACCEPTs after K rollouts. Use this as the reference for
# comparing against the LLMMutator run in mutated.yaml.
#
# Setup:
#   export GEMINI_API_KEY='...'
#   python scripts/run_harness.py --config experiments/toy24/original.yaml \
#       --run-name toy24-original

bridge:
  import_path: envharness.bridges.toy24:Toy24Env
  reset_options: {}

mutator:
  type: noop                                # NO mutation; original env only

policy:
  client_factory: envharness.infra.llm:LiteLLMClient
  client_kwargs:
    model: openai/gpt-4.1-mini
  action_format: function_calling

objective:
  # Objective is unused by NoopMutator but the orchestrator still computes
  # signals for the trace store -- keep difficulty_zone so the eventual
  # difficulty run can compare on the same metric.
  type: difficulty_zone
  target_band: [0.3, 0.7]
  window: 30

budget:
  type: capped_adaptive
  max_k: 1                                  # NoopMutator ACCEPTs immediately

orchestrator:
  task_id: toy24-baseline
  task_description: "Combine the four numbers using +, -, *, / to make 24."
  n_iterations: 5
  max_episode_steps: 12
  k_per_candidate: 3
  base_seed: 42

runner:
  type: subprocess
  timeout_seconds: 120

storage:
  trace_path: ./runs/{run_name}/traces.jsonl

logging:
  log_dir: ./runs/{run_name}
  log_policy_calls: true
  log_mutator_calls: true
