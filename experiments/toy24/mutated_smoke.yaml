# toy24 MUTATED -- SMOKE variant of mutated.yaml.
#
# Difference from mutated.yaml: the Harness Agent and the Policy both run on
# Gemini instead of anthropic/claude-opus-4-7 + openai/gpt-4o-mini, so the whole
# toy24 pipeline is runnable with the single GEMINI_API_KEY the other six
# experiments already require. Scale is also cut (2 tasks x K=2) so the run
# finishes in ~1 minute.
#
#   source ~/.config/envharness/gemini_keys.env
#   python scripts/run_harness.py --config experiments/toy24/mutated_smoke.yaml \
#       --run-name toy24-mutated-smoke

bridge:
  import_path: envharness.bridges.toy24:Toy24Env
  reset_options: {}
  reset_seed: null

mutator:
  client_factory: envharness.infra.llm:LiteLLMClient
  client_kwargs:
    model: openai/gpt-4.1-mini

policy:
  client_factory: envharness.infra.llm:LiteLLMClient
  client_kwargs:
    model: openai/gpt-4.1-mini
  action_format: function_calling
  temperature: 0.4          # band objective + K>1 requires temperature > 0

objective:
  type: difficulty_zone
  target_band: [0.3, 0.7]
  window: 30

budget:
  type: capped_adaptive
  max_k: 2

orchestrator:
  task_id: toy24-mutated-smoke
  task_description: "Combine the four numbers using +, -, *, / to make 24."
  n_tasks: 2
  max_episode_steps: 8
  k_per_candidate: 2
  base_seed: 42

runner:
  type: subprocess
  timeout_seconds: 180

storage:
  trace_path: ./runs/{run_name}/traces.jsonl

logging:
  log_dir: ./runs/{run_name}
  log_policy_calls: true
  log_mutator_calls: true
